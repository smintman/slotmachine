<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slot Machine Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="header">
        <div class="header-top">
            <h2>Slot Machine</h2>
            <div class="status-info">
                <span id="battery-indicator" class="status-item"><b>Battery:</b> --%</span>
                <span id="charge-indicator" class="status-item"><b>Status:</b> --</span>
            </div>
        </div>
        <div class="controls">
            <button id="running-button" class="running" onclick="toggleJob()">Running</button>
            <button onclick="checkCar(false)">Check Car</button>
            <button onclick="checkCar(true)">Check & Flash</button>
            <button onclick="refreshLogs()">Refresh</button>
            <button class="danger" onclick="clearLogs()">Clear Logs</button>
        </div>
    </div>
    <div id="logs-container">Initialising system dashboard...</div>
    <div class="footer-info">
        <div id="refresh-timestamp">Last refreshed: --:--:--</div>
        <div id="version-info">Version: 3.2.0</div>
    </div>

    <script src="script.js"></script>
</body>
</html>
